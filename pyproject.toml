[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bindery"
version = "0.26.0"
description = "High-speed EPUB repair surgeon with a persistent Java validation daemon, safe HTML unwrapping, and native Calibre integration."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["epub", "epubcheck", "calibre", "repair", "ebook", "html-repair", "watermarks"]
license = { text = "MIT" }
authors = [
  { name = "vrnvctss" },
]
# Core dependencies are minimal. html5lib is needed only for the opt-in --reserialize structural
# repair; it is imported lazily, so every other mode works without it installed.
# vir-tui is PINNED to an exact commit so builds are reproducible; bump deliberately.
# cquarry deliberately tracks @main (since v0.19.0): CI exercises current cquarry on
# every run instead of a stale snapshot, matching CalibreQuarry's dependency policy.
dependencies = [
  "tqdm",
  "vir-tui @ git+https://github.com/VirInvictus/vir-tui.git@e53f17efe233e0a03f003be7f6d15f7c097e868d",
  "cquarry @ git+https://github.com/VirInvictus/cquarry.git@main",]

[project.optional-dependencies]
reserialize = ["html5lib>=1.1"]

[project.scripts]
bindery = "bindery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bindery"]

[tool.ruff.lint]
# Pinned explicitly so `ruff check` means the same thing locally and in CI. Without
# this the result rode on whichever ruff was installed: 0.15 passed clean while 0.16
# reported eight findings under its wider defaults. This is ruff's default set plus
# import sorting (I), pyupgrade (UP), and bugbear (B).
#
# Deliberately NOT selected: RUF, whose RUF001 flags the U+2010/U+2011 hyphens in
# pagination._char_norm, where those exact characters are the point; and SIM, whose
# SIM103 would collapse validate.no_worse's commented guard clauses into one
# negated expression.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.hatch.metadata]
allow-direct-references = true
