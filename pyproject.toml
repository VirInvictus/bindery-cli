[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bindery-cli"
version = "0.40.0"
description = "Audit EPUB body text and repair broken EPUBs with deterministic, epubcheck-gated fixes; atomic in-place replacement in a Calibre library."
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
keywords = ["epub", "epubcheck", "calibre", "repair", "ebook", "html-repair", "watermarks"]
license = { text = "MIT" }
authors = [
  { name = "vrnvctss" },
]
# Core dependencies are minimal. html5lib is needed only for the opt-in --reserialize structural
# repair; it is imported lazily, so every other mode works without it installed.
# vir-tui and cquarry are pinned as PyPI ranges; uv.lock records the resolved versions.
# Both are marker-gated to 3.14+ because every release they ship declares
# requires-python >=3.14: without the markers a 3.12/3.13 install of this
# package would die in dependency resolution before `bindery repair` (which
# needs neither) could run. The audit/library surfaces degrade with a clean
# message (cli.py's dispatch guard) instead of installing at all.
dependencies = [
  "tqdm",
  "vir-tui>=2.2.0; python_version >= '3.14'",
  "cquarry>=1.19.0; python_version >= '3.14'",
]

[project.optional-dependencies]
reserialize = ["html5lib>=1.1"]

[project.scripts]
bindery = "bindery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bindery"]

[tool.ruff]
# Pin the rewrite level below the house interpreter on purpose: the Calibre
# plugin vendors these modules into Calibre's embedded interpreters, so the
# parenthesized except form must survive `ruff format`. A target inferred
# from requires-python >=3.14 rewrites it to the PEP 758 bare form, which is
# a SyntaxError on every released Calibre (see tests/test_version.py).
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly so `ruff check` means the same thing locally and in CI. Without
# this the result rode on whichever ruff was installed: 0.15 passed clean while 0.16
# reported eight findings under its wider defaults. This is ruff's default set plus
# import sorting (I), pyupgrade (UP), and bugbear (B).
#
# Deliberately NOT selected: RUF, whose RUF001 flags the U+2010/U+2011 hyphens in
# pagination._char_norm, where those exact characters are the point; and SIM, whose
# SIM103 would collapse validate.no_worse's commented guard clauses into one
# negated expression.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]


