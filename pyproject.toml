[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bindery"
version = "0.12.3"
description = "Repair EPUBs (well-formedness fixes plus an opt-in page-number strip), epubcheck-gated, with in-place Calibre library replacement"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
  { name = "vrnvctss" },
]
# Core is stdlib-only. html5lib is needed only for the opt-in --reserialize structural
# repair; it is imported lazily, so every other mode works without it installed.
dependencies = [
  "tqdm",]

[project.optional-dependencies]
reserialize = ["html5lib>=1.1"]

[project.scripts]
bindery = "bindery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bindery"]

[tool.ruff.lint]
# Pinned explicitly so `ruff check` means the same thing locally and in CI. Without
# this the result rode on whichever ruff was installed: 0.15 passed clean while 0.16
# reported eight findings under its wider defaults. This is ruff's default set plus
# import sorting (I), pyupgrade (UP), and bugbear (B).
#
# Deliberately NOT selected: RUF, whose RUF001 flags the U+2010/U+2011 hyphens in
# pagination._char_norm, where those exact characters are the point; and SIM, whose
# SIM103 would collapse validate.no_worse's commented guard clauses into one
# negated expression.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
