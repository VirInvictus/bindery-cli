name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run test suite
        run: |
          pip install .[reserialize]
          PYTHONPATH=src python -m unittest discover -s tests

  build-and-publish:
    name: Build distribution and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bindery-cli
    permissions:
      id-token: write # Required for OIDC authentication with PyPI

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  plugin-zip:
    name: Build the Bindery Repair Calibre plugin zip
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the plugin zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run the suite
        run: |
          pip install .[reserialize]
          PYTHONPATH=src python -m unittest discover -s tests

      - name: Build the plugin zip from the tagged tree
        run: python scripts/build_plugin.py

      - name: Attach BinderyRepair zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BinderyRepair-*.zip
