name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

# A tag push is a release: never cancel a publish mid-run, and two tags
# publishing concurrently would race the release page; serialize instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run test suite
        run: |
          pip install .[reserialize]
          PYTHONPATH=src python -m unittest discover -s tests

  build-and-publish:
    name: Build distribution and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bindery-cli
    permissions:
      id-token: write # Required for OIDC authentication with PyPI

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  plugin-zip:
    name: Build the Bindery Repair Calibre plugin zip
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the plugin zip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The suite already ran in the `test` job for this exact commit
      # (needs: gates this job on it); running it again per job doubled the
      # publish wall time for no extra signal.
      - name: Build the plugin zip from the tagged tree
        run: python scripts/build_plugin.py

      # The tag message IS the release's patchnotes entry (verbatim, per the
      # tagging procedure), so the release body is extracted from the tag
      # object rather than paraphrased here. The checkout is depth-1 and
      # leaves a LIGHTWEIGHT local tag on the commit (whose %(contents) is
      # the commit message, not the release entry), so the real annotated
      # tag object is force-fetched from the origin before reading it.
      - name: Fetch the tag object
        run: git fetch --no-tags --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Extract the release body from the tag message
        run: git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-body.md

      # SHA-pinned to action-gh-release v2 (3bb1273): it carries contents:
      # write, so the third-party action runs pinned, not floating.
      - name: Attach BinderyRepair zip to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: release-body.md
          files: dist/BinderyRepair-*.zip
